<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | KSIJ Mumbai</title>
<link rel="icon" href="assets/logo-ksij.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
<main id="main">
  <section class="page-head"><div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Contact us</div>
    <h1>Contact us</h1>
    <p>Write to the Jamat office or visit us in Dongri.</p>
  </div></section>
  <section class="section"><div class="wrap form-layout">
    <form class="card" data-confirm="Thanks. This message form is a front-end preview and is not sent yet." novalidate>
      <div class="form-grid">
        <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field full"><label for="msg">Message</label><textarea id="msg" name="msg" required></textarea></div>
        <div class="field full"><button class="btn btn-green" type="submit">Send message</button></div>
      </div>
    </form>
    <aside class="aside-card">
      <ul class="contact-list" style="padding:0;list-style:none">
        <li><span class="ic" data-icon="pin"></span><span><b>Address</b>66/70, Hazrat Abbas (a.s.) Street,<br>Dongri, Mumbai 400 009<br><a href="https://www.google.com/maps/search/?api=1&query=66%2F70+Hazrat+Abbas+Street+Dongri+Mumbai+400009" target="_blank" rel="noopener">Open in Maps</a></span></li>
        <li><span class="ic" data-icon="mail"></span><span><b>Email</b><a href="mailto:info@ksijamat.org">info@ksijamat.org</a></span></li>
      </ul>
    </aside>
  </div></section>
</main>
<script src="app.js"></script>
</body>
</html>
