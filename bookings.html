<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings | KSIJ Mumbai</title>
<link rel="icon" href="assets/logo-ksij.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="bookings">
<main id="main">
  <section class="page-head"><div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Bookings</div>
    <h1>Bookings</h1>
    <p>Tell us about your event and the Jamat office will get back to you.</p>
  </div></section>
  <section class="section"><div class="wrap form-layout">
    <form class="card" data-confirm="Thanks. This enquiry form is a front-end preview and is not sent yet." novalidate>
      <div class="form-grid">
        <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9+ ]{10,14}" required></div>
        <div class="field full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="type">Type of event</label>
          <select id="type" name="type" required><option value="">Choose one</option><option>Majlis</option><option>Nikah</option><option>Community event</option><option>Other</option></select></div>
        <div class="field"><label for="date">Preferred date</label><input id="date" name="date" type="date" required></div>
        <div class="field full"><label for="guests">Expected guests</label><input id="guests" name="guests" type="number" min="1" required></div>
        <div class="field full"><label for="notes">Anything else we should know</label><textarea id="notes" name="notes"></textarea></div>
        <div class="field full"><button class="btn btn-green" type="submit">Send enquiry</button></div>
      </div>
    </form>
    <aside class="aside-card">
      <h3>Prefer to talk?</h3>
      <p>Write to <a href="mailto:info@ksijamat.org">info@ksijamat.org</a> or visit the office at 66/70, Hazrat Abbas (a.s.) Street, Dongri.</p>
    </aside>
  </div></section>
</main>
<script src="app.js"></script>
</body>
</html>
